<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="update-my-mac logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#1b4fc4"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- Three sources feeding into one command. -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="30" cy="40" r="5"/>
    <circle cx="30" cy="64" r="5"/>
    <circle cx="30" cy="88" r="5"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M38 40 H54"/>
    <path d="M38 64 H54"/>
    <path d="M38 88 H54"/>
  </g>

  <!-- The refresh arrow they all lead to: an arc with a gap, and a head set
       tangentially into that gap so the two don't merge into a blob. -->
  <g transform="translate(86 64)" fill="none" stroke="#ffffff">
    <path d="M12 -20.78 A24 24 0 1 1 -16.97 -16.97" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(-13.77 -19.66) rotate(-35)" fill="#ffffff" stroke="none">
      <path d="M-2 -11 L-2 11 L18 0 Z"/>
    </g>
  </g>
</svg>
