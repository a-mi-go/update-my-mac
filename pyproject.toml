[project]
name = "update-my-mac"
version = "0.1.0"
description = "Check and apply macOS updates across mas, Homebrew, npm, pnpm and directly-downloaded apps."
readme = "README.md"
authors = [{ name = "a-mi-go" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "questionary>=2.0",
    "rich>=13.7",
]

[project.scripts]
update = "update_my_mac.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/update_my_mac"]

[tool.uv]
# setup.sh installs whatever uv Homebrew currently ships; this is the floor it
# has to clear (uv tool install --editable, automatic Python downloads).
required-version = ">=0.5.0"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
