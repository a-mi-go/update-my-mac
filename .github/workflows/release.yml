name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, pyproject says $version" >&2; exit 1; }
      - name: Build the archive
        run: git archive --prefix=update-my-mac/ -o update-my-mac.tar.gz HEAD
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" update-my-mac.tar.gz install.sh --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: update-my-mac
          path: |
            update-my-mac.tar.gz
            install.sh

  smoke:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Install it the way a user would
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tools
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          export UPDATE_MY_MAC_ARCHIVE_URL="$RELEASE_URL/update-my-mac.tar.gz"
          /bin/bash -c "$(curl -fsSL "$RELEASE_URL/install.sh")" install --name update
          export PATH="${{ runner.temp }}/tools:$PATH"
          UPDATE_MY_MAC_PREFIXES= update --version
