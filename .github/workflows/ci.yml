name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The shipped tool targets macOS, but everything macOS-specific is
        # mocked, so Linux validates the OS-independent logic too.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Check the package builds
        run: uv build --no-sources
